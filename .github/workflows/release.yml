name: Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Tipo de Versão (minor = 1.1...1.10 -> 2.0 | major = salto de versão)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suites
        run: npm test

      - name: Build Portable Executable
        run: npm run dist:portable

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          $portable = Get-ChildItem -Path "release\Optimizer-Portable-*.exe" | Select-Object -First 1
          if ($portable) {
            Copy-Item -Path $portable.FullName -Destination "release\Optimizer-Portable.exe" -Force
            Write-Host "Prepared asset: release\Optimizer-Portable.exe"
          } else {
            throw "Executable not found in release folder!"
          }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/Optimizer-Portable.exe
          name: Optimizer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
